name: Deploy Zentrax Front

on:
  push:
    branches: [main]

concurrency:
  group: zentrax-front-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, zentrax-front]
    defaults:
      run:
        working-directory: /var/www/zentrax/frontend
    steps:
      - name: Pull latest code
        run: git pull origin main

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Restart app
        run: pm2 restart Zentrax2.0

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 3
            status=$(curl -s -o /dev/null -w "%{http_code}" https://app.zentrax.dvls.com.br/)
            if [ "$status" == "307" ]; then
              echo "Health check OK: $status"
              exit 0
            fi
            echo "Tentativa $i: esperava 307, veio $status - tentando de novo..."
          done
          echo "Health check failed after retries: got $status"
          exit 1
